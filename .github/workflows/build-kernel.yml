name: Build-Kernel

on:
   workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Cache Toolchains
      uses: actions/cache@v5
      with:
        path: toolchain
        key: ${{ runner.os }}-toolchains-r530567-v1

    - name: Build Kernel
      run:
        chmod +x build_kernel_zip.sh
        ./build_kernel_zip.sh

    - name: Upload Kernel (artifact)
      uses: actions/upload-artifact@v7
      with:
        name: "kernel-${{ github.sha }}"
        path: "*.zip"
