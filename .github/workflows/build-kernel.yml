name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - susfs
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: false
          fetch-depth: 1

      - name: Cache Toolchains
        uses: actions/cache@v5
        id: cache-toolchains
        with:
          path: toolchain/
          key: ${{ runner.os }}-toolchains-r596125

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flex kmod cpio libelf-dev

      - name: Compile Kernel
        run: |
          chmod +x ./build_kernel_zip.sh
          ./build_kernel_zip.sh

      - name: Upload OneUI Release
        uses: actions/upload-artifact@v7
        with:
          path: "release/*One-UI*.zip"
          archive: false

      - name: Upload AOSP Release
        uses: actions/upload-artifact@v7
        with:
          path: "release/*AOSP*.zip"
          archive: false

      - name: Upload Kernel Config
        uses: actions/upload-artifact@v7
        with:
          path: "release/.config"
          archive: false
          include-hidden-files: true
