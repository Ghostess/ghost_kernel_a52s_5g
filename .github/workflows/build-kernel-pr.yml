name: Build Kernel (PR)

on:
  pull_request:
    branches:
      - ksu-next

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache Toolchains
        uses: actions/cache@v5
        id: cache-toolchains
        with:
          path: toolchain/
          # give this workflow its own cache, just in case.
          key: ${{ runner.os }}-toolchains-r530567-pr

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flex kmod cpio libelf-dev gcc-aarch64-linux-gnu

      - name: Compile Kernel
        run: |
          chmod +x ./build_kernel_zip.sh
          ./build_kernel_zip.sh || true

      # cause we continue on error (it was erroring on success so this is better i guess)
      - name: Check if kernel zip exists 
        run: |
          zips=( *.zip )
          if [ ! -e "${zips[0]}" ]; then
              exit 1
          fi

      - name: Upload Kernel
        uses: actions/upload-artifact@v7
        with:
          name: "a52s_oneui_ksu-next-${{ github.sha }}"
          path: "*.zip"
          compression-level: 0
