name: Build Kernel (PR)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - susfs
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: false
          fetch-depth: 1

      - name: Cache Toolchains
        uses: actions/cache@v5
        id: cache-toolchains
        with:
          path: toolchain/
          # give this workflow its own cache, just in case.
          key: ${{ runner.os }}-toolchains-r596125-pr

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flex kmod cpio libelf-dev gcc-aarch64-linux-gnu

      - name: Compile Kernel
        run: |
          chmod +x ./build_kernel_zip.sh
          ./build_kernel_zip.sh

      - name: Upload OneUI Release
        uses: actions/upload-artifact@v7
        with:
          path: "release/*One-UI*.zip"
          archive: false

      - name: Upload AOSP Release
        uses: actions/upload-artifact@v7
        with:
          path: "release/*AOSP*.zip"
          archive: false

      - name: Upload Kernel Config
        uses: actions/upload-artifact@v7
        with:
          path: "release/.config"
          archive: false
          include-hidden-files: true
