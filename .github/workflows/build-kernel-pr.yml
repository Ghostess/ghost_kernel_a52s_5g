name: Build Kernel (PR)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'README.md'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: false
          fetch-depth: 1

      - name: Checkout submodules
        run: |
          git submodule update --init --recursive --depth 1
          git submodule foreach --recursive '
            echo "Unshallowing submodule: $name"
            git fetch --unshallow || git fetch
            git checkout -f
          '

      - name: Cache Toolchains
        uses: actions/cache@v5
        id: cache-toolchains
        with:
          path: toolchain/
          # give this workflow its own cache, just in case.
          key: ${{ runner.os }}-toolchains-r530567-pr

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flex kmod cpio libelf-dev gcc-aarch64-linux-gnu

      - name: Compile Kernel
        run: |
          chmod +x ./build_kernel_zip.sh
          ./build_kernel_zip.sh
          
      - name: Set sha_short env variable
        run: echo "sha_short=`git rev-parse --short HEAD`" >> $GITHUB_ENV
        
      - name: Upload Release Artifact
        uses: actions/upload-artifact@v7
        with:
          name: "ghost_kernel-${{ env.sha_short }}-pr"
          path: "release/"
          compression-level: 0
          include-hidden-files: true